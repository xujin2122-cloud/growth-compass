<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Compass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .hidden {
            display: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #fileList {
            list-style: none;
            margin-top: 20px;
        }
        #fileList li {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .download-btn {
            background: #28a745;
            padding: 6px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Growth Compass</h1>
            <p>Save your progress to Google Drive</p>
        </div>

        <div class="card">
            <div id="authSection">
                <h2 style="margin-bottom: 20px;">Authentication</h2>
                <div class="input-group">
                    <label for="clientId">Google Client ID</label>
                    <input type="text" id="clientId" placeholder="Enter your Google OAuth Client ID">
                </div>
                <button id="authorizeBtn" class="btn">Authorize with Google</button>
                <div id="authStatus" class="status"></div>
            </div>

            <div id="mainSection" class="hidden">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Growth Tracker</h2>
                    <button id="saveToDriveBtn" class="btn">
                        <span id="saveText">Save to Google Drive</span>
                        <span id="loadingSpinner" class="hidden"></span>
                    </button>
                </div>

                <div class="input-group">
                    <label for="entryTitle">Title</label>
                    <input type="text" id="entryTitle" placeholder="Enter entry title">
                </div>

                <div class="input-group">
                    <label for="entryContent">Content</label>
                    <textarea id="entryContent" placeholder="Enter your thoughts..."></textarea>
                </div>

                <button onclick="saveLocally()" class="btn">Save Locally</button>

                <div id="saveStatus" class="status"></div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 20px;">Saved Files</h2>
            <button id="loadFilesBtn" class="btn">Load Files from Drive</button>
            <ul id="fileList"></ul>
        </div>
    </div>

    <script>
        // HARD-CODED CLIENT ID - No more popup!
        const CLIENT_ID = '676675746981-9j4r8doeue3g1vr9jb87in70n0oagv5d.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyBoGzlMbVNG3zEu9CKjF9JeeYzWbiJQxjk';
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gclient;
        let accessToken = null;

        window.onload = function() {
            // Initialize clients on page load
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: function(response) {
                    if (response.error) {
                        console.error('Token client error:', response);
                        return;
                    }
                    accessToken = response.access_token;
                    showMainSection();
                    document.getElementById('clientId').value = CLIENT_ID;
                    document.getElementById('clientId').disabled = true;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('mainSection').classList.remove('hidden');
                }
            });

            gclient = google.accounts.id.initializeClient({
                clientId: CLIENT_ID,
                callback: function(response) {
                    // JWT callback
                }
            });

            // Check localStorage first
            const savedClientId = localStorage.getItem('growth_compass_client_id');
            if (savedClientId) {
                document.getElementById('clientId').value = savedClientId;
            } else {
                document.getElementById('clientId').value = CLIENT_ID;
            }
        };

        document.getElementById('authorizeBtn').onclick = function() {
            const clientId = document.getElementById('clientId').value.trim();
            if (!clientId) {
                showStatus('authStatus', 'Please enter a Client ID', 'error');
                return;
            }
            localStorage.setItem('growth_compass_client_id', clientId);

            // Reinitialize token client with new client ID
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: SCOPES,
                callback: function(response) {
                    handleTokenResponse(response);
                }
            });

            tokenClient.requestAccessToken({prompt: 'consent'});
        };

        function handleTokenResponse(response) {
            if (response.error === 'access_denied') {
                showStatus('authStatus', 'Access denied. Please try again.', 'error');
                return;
            } else if (response.error) {
                showStatus('authStatus', 'Error: ' + response.error_description || response.error, 'error');
                return;
            }

            accessToken = response.access_token;
            localStorage.setItem('growth_compass_access_token', accessToken);
            showMainSection();

            document.getElementById('clientId').value = CLIENT_ID;
            document.getElementById('clientId').disabled = true;
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            showStatus('authStatus', 'Successfully authorized!', 'success');
        }

        function showMainSection() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
        }

        function saveLocally() {
            const title = document.getElementById('entryTitle').value;
            const content = document.getElementById('entryContent').value;

            if (!title || !content) {
                showStatus('saveStatus', 'Please fill in both title and content', 'error');
                return;
            }

            const entry = {
                title: title,
                content: content,
                timestamp: new Date().toISOString()
            };

            let entries = JSON.parse(localStorage.getItem('growth_entries') || '[]');
            entries.push(entry);
            localStorage.setItem('growth_entries', JSON.stringify(entries));

            showStatus('saveStatus', 'Saved locally! Click "Save to Google Drive" to backup.', 'success');
        }

        async function uploadToDrive(fileData) {
            try {
                // First search for existing file by name
                const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='${fileData.name}' and mimeType='application/json'`;

                const searchResponse = await fetch(searchUrl, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                let fileId = null;
                if (searchResponse.ok) {
                    const searchData = await searchResponse.json();
                    if (searchData.files && searchData.files.length > 0) {
                        // Found existing file, use its ID
                        fileId = searchData.files[0].id;
                        console.log('Found existing file ID:', fileId);
                    }
                }

                // Upload/Update file using media upload endpoint
                const uploadUrl = fileId
                    ? `https://upload.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,name,size,modifiedTime`
                    : 'https://upload.googleapis.com/upload/drive/v3/files?uploadType=media&fields=id,name,size,modifiedTime';

                const uploadResponse = await fetch(uploadUrl, {
                    method: fileId ? 'PUT' : 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(fileData.content)
                });

                if (!uploadResponse.ok) {
                    const errorText = await uploadResponse.text();
                    throw new Error(`Upload failed (${uploadResponse.status}): ${errorText}`);
                }

                const result = await uploadResponse.json();
                console.log('Upload successful:', result);
                return result;

            } catch (error) {
                console.error('Upload error:', error);
                throw error;
            }
        }

        document.getElementById('saveToDriveBtn').onclick = async function() {
            if (!accessToken) {
                alert('Please authorize first');
                return;
            }

            const title = document.getElementById('entryTitle').value;
            const content = document.getElementById('entryContent').value;

            if (!title || !content) {
                alert('Please fill in both fields');
                return;
            }

            const btn = document.getElementById('saveToDriveBtn');
            const saveText = document.getElementById('saveText');
            const spinner = document.getElementById('loadingSpinner');

            btn.disabled = true;
            saveText.textContent = 'Uploading...';
            spinner.classList.remove('hidden');

            try {
                const fileData = {
                    name: `${title}.json`,
                    mimeType: 'application/json',
                    content: {
                        title: title,
                        content: content,
                        timestamp: new Date().toISOString()
                    }
                };

                const result = await uploadToDrive(fileData);
                showStatus('saveStatus', `Successfully saved to Drive! File ID: ${result.id}, Size: ${result.size} bytes`, 'success');
            } catch (error) {
                console.error('Error:', error);
                showStatus('saveStatus', `Upload failed: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                saveText.textContent = 'Save to Google Drive';
                spinner.classList.add('hidden');
            }
        };

        document.getElementById('loadFilesBtn').onclick = async function() {
            if (!accessToken) {
                alert('Please authorize first');
                return;
            }

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<li>Loading files...</li>';

            try {
                const url = 'https://www.googleapis.com/drive/v3/files?fields=files(id,name,size,modifiedTime)&pageSize=10';
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch files');
                }

                const data = await response.json();
                fileList.innerHTML = '';

                if (!data.files || data.files.length === 0) {
                    fileList.innerHTML = '<li>No files found on Drive</li>';
                    return;
                }

                data.files.forEach(file => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${file.name} (${formatBytes(file.size)})</span>
                        <button class="btn download-btn" onclick="downloadFile('${file.id}', '${file.name}')">Download</button>
                    `;
                    fileList.appendChild(li);
                });

            } catch (error) {
                console.error('Error:', error);
                fileList.innerHTML = `<li>Error: ${error.message}</li>`;
            }
        };

        async function downloadFile(fileId, fileName) {
            try {
                const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to download file');
                }

                const blob = await response.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
                URL.revokeObjectURL(link.href);

            } catch (error) {
                console.error('Download error:', error);
                alert('Download failed: ' + error.message);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'status ' + type;

            if (type === 'success') {
                setTimeout(() => {
                    element.className = 'status';
                }, 5000);
            }
        }
    </script>

    <script async defer src="https://accounts.google.com/gsi/client"></script>
</body>
</html>
